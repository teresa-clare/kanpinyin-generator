  /* 纸张大小，可选（注意区分大小写）：

  /* 田字格大小，单位像素。51px ≈ 1.35cm，适合低年级书写。

  /* 中文字体，可选（注意区分大小写）：
     "kaiti"  —— 楷体（默认，最贴合课本书写规范）

     "heiti"  —— 黑体

     应用于：标题、姓名栏、古诗标题、作者行。
     拼音固定使用 Times New Roman，不随此设置变化。 */
  fontChinese: "kaiti",

  /* 词汇内容：词与词之间用空格、逗号或换行分隔均可

     好吗|hǎo ma                  音节用空格或短横线分隔

  words:
    "希望 这个 小工具 " +
    "能够 帮助你 " ,

  /* ---------- 古诗栏目（位于词汇之后，支持多首） ----------

     title : 诗名（居中显示）

<!-- 预览区域 -->

<script>
/* 纸张定义：宽 × 高（mm），页边距统一 1.5cm */
const PAPERS = {
  A4:     { w: 210,   h: 297, css: 'A4' },
  A3:     { w: 297,   h: 420, css: 'A3' },
  B5:     { w: 176,   h: 250, css: 'B5' },
  letter: { w: 215.9, h: 279.4, css: 'letter' }
};
const MARGIN_MM = 30;              // 页边距合计（上下、左右各 1.5cm × 2）
const MM_TO_PX  = 96 / 25.4;       // CSS 规定 1in = 96px
const SAFETY_PX = 1;               // 装箱安全余量，抵消亚像素舍入

/* 中文字体栈：key 对应下拉框 / CONFIG.fontChinese 的取值
   每个栈按 Windows → macOS 顺序排列，末尾留 serif/sans-serif 兜底，
   目标机器缺字体时浏览器会自动回退到后面的字体 */
const FONT_STACKS = {
  kaiti:    "'KaiTi','STKaiti','DFKai-SB',serif",
  songti:   "'SimSun','Songti SC',serif",
  heiti:    "'SimHei','Heiti SC',sans-serif",
  yahei:    "'Microsoft YaHei','PingFang SC',sans-serif",
  fangsong: "'FangSong','STFangsong',serif",
  youyuan:  "'YouYuan','Yuanti SC',sans-serif",
  xingkai:  "'STXingkai','Xingkai SC',cursive",
  xinwei:   "'STXinwei','LiSu',cursive"
};
/* 拼音字体：固定，不提供选择 */
const PY_FONT = "'Times New Roman', serif";

/* 当前布局状态：generate() 时保存（导出 Word 功能关闭中，暂不使用） */
let currentLayout = null;

/* 当前格宽（buildPoem 内使用，generate() 时赋值） */
let currentCellSize = 51;

/* ============================================================
 *  拼音覆盖 —— 解析用户手动指定的拼音
 * ============================================================ */

/* 声调符号映射表：TONE_MAP[元音][声调-1] = 带调元音 */
const TONE_MAP = {
  'a': ['ā','á','ǎ','à'], 'e': ['ē','é','ě','è'],
  'i': ['ī','í','ǐ','ì'], 'o': ['ō','ó','ǒ','ò'],
  'u': ['ū','ú','ǔ','ù'], 'ü': ['ǖ','ǘ','ǚ','ǜ'],
  'A': ['Ā','Á','Ǎ','À'], 'E': ['Ē','É','Ě','È'],
  'I': ['Ī','Í','Ǐ','Ì'], 'O': ['Ō','Ó','Ǒ','Ò'],
  'U': ['Ū','Ú','Ǔ','Ù'], 'Ü': ['Ǖ','Ǘ','Ǚ','Ǜ']
};

/* 解析拼音字符串：音节用空格或 - 分隔，支持数字声调和 v→ü
   返回：转换后的拼音音节数组；输入无效时返回 null（回退自动识别） */
function parsePyOverride(pyStr) {
  if (!pyStr || !pyStr.trim()) return null;
  /* 拒绝包含汉字的"拼音"（用户误输入时回退到自动识别） */
  if (/[\u4e00-\u9fff]/.test(pyStr)) return null;

  const syllables = pyStr.trim().split(/[\s\-]+/).filter(Boolean);
  if (syllables.length === 0) return null;
  return syllables.map(syl => convertPySyllable(syl));
}

/* 单个音节转换：处理数字声调、v→ü、声调符号位置
   标调规则：a > e > o > 最后一个 i/u/ü（与拼音规范一致） */
function convertPySyllable(syl) {
  /* 提取末尾的声调数字 */
  let tone = 0;
  const m = syl.match(/([1-5])$/);
  if (m) {
    tone = parseInt(m[1]);
    syl = syl.slice(0, -1);
  }

  /* v → ü（小写），V → Ü（大写） */
  syl = syl.replace(/v/g, 'ü').replace(/V/g, 'Ü');

  /* 声调 5 或无数字 = 轻声，不加声调符号 */
  if (tone === 0 || tone === 5) return syl;

  /* 找到要标调的元音位置 */
  let markIdx = -1;
  const idxA = syl.search(/[aA]/);
  const idxE = syl.search(/[eE]/);
  const idxO = syl.search(/[oO]/);

  if (idxA !== -1) markIdx = idxA;
  else if (idxE !== -1) markIdx = idxE;
  else if (idxO !== -1) markIdx = idxO;
  else {
    /* 无 a/e/o 时标在最后一个 i / u / ü 上（如 liú、guì、nǚ） */
    for (let j = syl.length - 1; j >= 0; j--) {
      if ('iuüIUÜ'.includes(syl[j])) {
        markIdx = j;
        break;
      }
    }
  }

  if (markIdx === -1) return syl;

  const tonedChar = TONE_MAP[syl[markIdx]]
    ? TONE_MAP[syl[markIdx]][tone - 1] : null;
  if (!tonedChar) return syl;

  return syl.slice(0, markIdx) + tonedChar + syl.slice(markIdx + 1);
}

/* ============================================================ */

/* 把 CONFIG 的默认值填入各个控件（用户之后仍可在页面上临时修改） */
function applyConfigToControls() {
  document.getElementById('title').value    = CONFIG.title    || '';
  document.getElementById('nameLine').value = CONFIG.nameLine || '';
  document.getElementById('paperSize').value = PAPERS[CONFIG.paperSize] ? CONFIG.paperSize : 'A4';
  document.getElementById('packMode').value  = ['order','fill','sorted'].includes(CONFIG.packMode) ? CONFIG.packMode : 'fill';
  document.getElementById('cellSize').value  = CONFIG.cellSize;
  document.getElementById('wordGap').value   = CONFIG.wordGap;
  document.getElementById('words').value     = CONFIG.words    || '';

  /* 中文字体：CONFIG 值无效时回退到楷体 */
  document.getElementById('fontChinese').value =
    FONT_STACKS[CONFIG.fontChinese] ? CONFIG.fontChinese : 'kaiti';

  /* 多首古诗 → 每行一首的文本（诗名|作者|行数|每行字数） */
  const poems = Array.isArray(CONFIG.poems) ? CONFIG.poems : [];
  document.getElementById('poems').value = poems.map(p =>
    [p.title || '', p.author || '', p.lines ?? 4, p.chars ?? 7].join('|')
  ).join('\n');
}

/* 分词：支持"词|拼音"语法
   先按逗号、顿号、分号、换行切分段落；段落内以空格分词。
   竖线后跟随的拼音音节用空格或 - 分隔，
   遇到汉字 token 或下一个带 | 的词即停止收集，自动区分归属。
   返回：[{ text: "词语", pyOverride: ["pīn","yīn"] | null }, ...] */
function parseWords(text) {
  const segments = text.split(/[,，、;；\n]+/);
  const results = [];

  for (const seg of segments) {
    const trimmed = seg.trim();
    if (!trimmed) continue;
    const tokens = trimmed.split(/\s+/);

    let i = 0;
    while (i < tokens.length) {
      const token = tokens[i];
      i++;

      const pipeIdx = token.indexOf('|');
      if (pipeIdx === -1) {
        /* 普通词，无拼音覆盖 */
        if (token) results.push({ text: token, pyOverride: null });
        continue;
      }

      /* 带 | 的词：竖线前是词语，竖线后是拼音的开头 */
      const word = token.slice(0, pipeIdx).trim();
      let pyStr = token.slice(pipeIdx + 1).trim();

      /* 收集后续拉丁字母 token 作为拼音音节 */
      while (i < tokens.length) {
        const next = tokens[i];
        /* 遇到汉字（其它词）或下一个带 | 的词 → 停止 */
        if (/[\u4e00-\u9fff]/.test(next) || next.includes('|')) break;
        /* 非拉丁字母 token（如标点）→ 停止 */
        if (!/[a-zA-Z]/.test(next)) break;
        pyStr += (pyStr ? ' ' : '') + next;
        i++;
      }

      if (word) {
        results.push({ text: word, pyOverride: parsePyOverride(pyStr) });
      }
    }
  }
  return results.filter(w => w.text);
}

/* 解析古诗文本：每行一首「诗名|作者|行数|每行字数」
   分隔符兼容 | 、｜、逗号（中英文）、顿号 */
function parsePoems(text) {
  const poems = [];
  text.split(/\n+/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split(/[|｜,，、]/).map(s => s.trim());
    if (parts.length === 0) return;
    poems.push({
      title:  parts[0] || '',
      author: parts[1] || '',
      lines:  Math.min(20, Math.max(0, parseInt(parts[2]) || 0)),
      chars:  Math.min(20, Math.max(1, parseInt(parts[3]) || 7))
    });
  });
  return poems.filter(p => p.title && p.lines > 0);
}

/* 整词转拼音：优先使用用户指定的拼音，否则调用 pinyin-pro 库 */
function getPinyinArr(word, pyOverride) {
  const chars = [...word];

  /* 用户指定了拼音：按汉字顺序逐一对齐 */
  if (pyOverride && pyOverride.length > 0) {
    let pyIdx = 0;
    return chars.map(ch => {
      if (/[\u4e00-\u9fa5]/.test(ch)) {
        return pyOverride[pyIdx++] || '';
      }
      return '';
    });
  }

  /* 未指定：使用 pinyin-pro 库自动识别（多音字按词组语境判断） */
  if (typeof pinyinPro === 'undefined') return chars.map(() => '');
  try {
    const arr = pinyinPro.pinyin(word, { toneType: 'symbol', type: 'array' });
    return chars.map((ch, i) =>
      /[\u4e00-\u9fa5]/.test(ch) ? (arr[i] || '') : ''
    );
  } catch (e) {
    return chars.map(ch => {
      if (/[\u4e00-\u9fa5]/.test(ch)) {
        try { return pinyinPro.pinyin(ch, { toneType: 'symbol' }); } catch (e2) { return ''; }
      }
      return '';
    });
  }
}

/* HTML 转义（用于标题/姓名等用户输入文本） */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* 纸张切换：
   预览纸张 = 整张纸宽，内边距 15mm 模拟页边距
   内容区宽度 = 纸宽 − 30mm，与打印 @page 提供的可用宽度相等 */
function applyPaper() {
  const p = PAPERS[document.getElementById('paperSize').value];
  document.getElementById('pageStyle').textContent =
    `@page { size: ${p.css}; margin: 1.5cm; }`;
  document.getElementById('sheet').style.width = p.w + 'mm';
  return (p.w - MARGIN_MM) * MM_TO_PX;
}

/* 词语宽度 = 字数 × 格宽（word 为 {text, pyOverride} 对象） */
function wordWidth(word, cellSize) {
  return [...word.text].length * cellSize;
}

/* 装箱：
   order   = 保持顺序，放不下就换行
   fill    = 允许补位，放不下的先跳过，短词前移
   sorted  = 先按长度稳定排序，再按顺序装箱 */
function packRows(words, cellSize, wordGap, availPx, mode) {
  const limit = availPx - SAFETY_PX;
  const rows = [];

  /* sorted：稳定排序后走 order 逻辑 */
  if (mode === 'sorted') {
    words = [...words].sort((a, b) =>
      [...a.text].length - [...b.text].length
    );
    mode = 'order';
  }

  if (mode === 'order') {
    let row = [], rowW = 0;
    words.forEach(word => {
      const w = wordWidth(word, cellSize);
      const need = row.length === 0 ? w : rowW + wordGap + w;
      if (need <= limit) {
        row.push(word);
        rowW = need;
      } else {
        rows.push(row);
        row = [word];
        rowW = w;
      }
    });
    if (row.length) rows.push(row);
    return rows;
  }

  /* fill 模式：first-fit 跳过补位 */
  const remaining = [...words];
  while (remaining.length) {
    const row = [];
    let rowW = 0;
    for (let i = 0; i < remaining.length; ) {
      const w = wordWidth(remaining[i], cellSize);
      const need = row.length === 0 ? w : rowW + wordGap + w;
      if (need <= limit) {
        row.push(remaining.splice(i, 1)[0]);
        rowW = need;
      } else {
        i++;
      }
    }
    if (row.length === 0) {
      let minIdx = 0;
      remaining.forEach((w, idx) => {
        if (wordWidth(w, cellSize) < wordWidth(remaining[minIdx], cellSize)) minIdx = idx;
      });
      row.push(remaining.splice(minIdx, 1)[0]);
    }
    rows.push(row);
  }
  return rows;
}

/* 生成一个词语卡片（屏幕预览用，flex 版）
   拼音字体固定 Times New Roman（CSS 中已定义，无需内联覆盖） */
function buildCard(word, cellSize, pySize) {
  const card = document.createElement('div');
  card.className = 'card';

  const chars = [...word.text];
  const pinyinArr = getPinyinArr(word.text, word.pyOverride);

  const pyRow = document.createElement('div');
  pyRow.className = 'py-row';
  chars.forEach((ch, j) => {
    const py = document.createElement('div');
    py.className = 'py';
    py.textContent = pinyinArr[j] || '';
    py.style.width    = cellSize + 'px';
    py.style.fontSize = pySize + 'px';
    pyRow.appendChild(py);
  });
  card.appendChild(pyRow);

  const tzRow = document.createElement('div');
  tzRow.className = 'tz-row';
  chars.forEach(() => {
    const tz = document.createElement('div');
    tz.className = 'tz';
    tz.style.width  = cellSize + 'px';
    tz.style.height = cellSize + 'px';
    const hline = document.createElement('span'); hline.className = 'h';
    const vline = document.createElement('span'); vline.className = 'v';
    tz.appendChild(hline); tz.appendChild(vline);
    tzRow.appendChild(tz);
  });
  card.appendChild(tzRow);

  return card;
}

/* 生成一首古诗栏目：诗名 + 作者（或填写线）+ 指定行数的书写横线
   fontCn：中文字体栈，应用于诗名与作者行 */
function buildPoem(poem, fontCn) {
  const block = document.createElement('div');
  block.className = 'poem-block';

  const t = document.createElement('div');
  t.className = 'poem-title';
  t.textContent = poem.title;
  t.style.fontFamily = fontCn;
  block.appendChild(t);

  if (poem.author) {
    /* 有作者：直接显示文字 */
    const a = document.createElement('div');
    a.className = 'poem-author';
    a.textContent = poem.author;
    a.style.fontFamily = fontCn;
    block.appendChild(a);
  } else {
    /* 无作者：生成一条短横线，供学生填写作者 */
    const al = document.createElement('div');
    al.className = 'poem-author-line';
    block.appendChild(al);
  }

  for (let i = 0; i < poem.lines; i++) {
    const line = document.createElement('div');
    line.className = 'poem-line';
    line.style.width = (poem.chars * currentCellSize) + 'px';  // 横线长 = 字数 × 田字格宽
    block.appendChild(line);
  }
  return block;
}

/* 生成预览 */
function generate() {
  if (typeof pinyinPro === 'undefined') {
    alert('拼音库加载失败，请检查网络后刷新页面。');
    return;
  }
  const title    = document.getElementById('title').value;
  const nameLine = document.getElementById('nameLine').value;
  const cellSize = Math.max(28, parseInt(document.getElementById('cellSize').value) || 51);
  const wordGap  = Math.max(0,  parseInt(document.getElementById('wordGap').value)  || 12);
  const packMode = document.getElementById('packMode').value;
  const paperKey = document.getElementById('paperSize').value;
  const words    = parseWords(document.getElementById('words').value);
  const poems    = parsePoems(document.getElementById('poems').value);

  if (words.length === 0 && poems.length === 0) {
    alert('请输入至少一个词汇，或至少一首古诗'); return;
  }

  /* 中文字体：读下拉框 → 取对应字体栈（无效 key 回退楷体） */
  const fontKey = document.getElementById('fontChinese').value;
  const fontCn  = FONT_STACKS[fontKey] || FONT_STACKS.kaiti;

  currentCellSize = cellSize;
  const availPx = applyPaper();

  const inner = document.getElementById('sheetInner');
  inner.innerHTML = '';

  const h = document.createElement('div');
  h.className = 'sheet-title';
  h.textContent = title;
  h.style.fontFamily = fontCn;
  inner.appendChild(h);

  if (nameLine) {
    const nl = document.createElement('div');
    nl.className = 'sheet-name';
    nl.textContent = nameLine;
    nl.style.fontFamily = fontCn;
    inner.appendChild(nl);
  }

  const pySize = Math.max(11, Math.round(cellSize * 0.3));

  /* 词汇区（词汇为空时跳过，只出古诗） */
  let rows = [];
  if (words.length > 0) {
    rows = packRows(words, cellSize, wordGap, availPx, packMode);
    rows.forEach(rowWords => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'word-row';
      rowDiv.style.gap = wordGap + 'px';
      rowWords.forEach(word => rowDiv.appendChild(buildCard(word, cellSize, pySize)));
      inner.appendChild(rowDiv);
    });
  }

  /* 古诗区：按输入顺序依次生成多首，位于词汇之后 */
  poems.forEach(poem => inner.appendChild(buildPoem(poem, fontCn)));

  /* 保存布局状态（导出 Word 功能关闭中，保留以备恢复） */
  currentLayout = { title, nameLine, cellSize, wordGap, pySize, rows, paperKey, poems, fontKey, fontCn };
}

/* ============================================================
   ★ 导出 Word 功能（暂时注释关闭）★
   恢复方法：删除本注释块前后的 "/*" 与 "*∕" 标记即可。
   （内部已适配"词|拼音"对象格式与中文字体选择）
   ============================================================

function px2pt(v) { return +(v * 0.75).toFixed(2); }

function wordTableHTML(word, cellPt, pyPt) {
  const chars = [...word.text];
  const py = getPinyinArr(word.text, word.pyOverride);

  let t = '<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;">';

  t += '<tr>';
  chars.forEach((ch, j) => {
    t += `<td style="width:${cellPt}pt;height:${(pyPt * 1.4).toFixed(2)}pt;` +
         `text-align:center;vertical-align:bottom;padding:0;border:none;` +
         `font-family:${PY_FONT};font-size:${pyPt}pt;color:#000;">` +
         (py[j] || '') + '</td>';
  });
  t += '</tr>';

  t += '<tr>';
  chars.forEach(() => {
    const frame = 'border:0.75pt solid #333;';
    t += `<td style="width:${cellPt}pt;height:${cellPt}pt;padding:0;border:none;${frame}">` +
         '<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%;height:100%;">' +
         '<tr>' +
         '<td style="border:none;border-right:0.5pt dashed #bbb;border-bottom:0.5pt dashed #bbb;"></td>' +
         '<td style="border:none;border-bottom:0.5pt dashed #bbb;"></td>' +
         '</tr><tr>' +
         '<td style="border:none;border-right:0.5pt dashed #bbb;"></td>' +
         '<td style="border:none;"></td>' +
         '</tr></table></td>';
  });
  t += '</tr></table>';
  return t;
}

function lineTableHTML(rowWords, cellPt, gapPt, pyPt) {
  let t = '<table cellspacing="0" cellpadding="0" style="border-collapse:collapse;"><tr>';
  rowWords.forEach((word, i) => {
    t += `<td style="padding:0;vertical-align:bottom;` +
         (i > 0 ? `padding-left:${gapPt}pt;` : '') + '">';
    t += wordTableHTML(word, cellPt, pyPt);
    t += '</td>';
  });
  t += '</tr></table>';
  return t;
}

function nameLineHTML(nameLine, namePt, fontCn) {
  const m = nameLine.match(/(_{2,})\s*$/);
  if (!m) {
    return `<p style="text-align:right;font-size:${namePt}pt;` +
           `font-family:${fontCn};margin:0 0 ${px2pt(20)}pt 0;">${esc(nameLine)}</p>`;
  }
  const before = esc(nameLine.slice(0, m.index));
  const lineW  = px2pt(m[1].length * 14);
  return `<p style="text-align:right;font-size:${namePt}pt;` +
         `font-family:${fontCn};margin:0 0 ${px2pt(20)}pt 0;">${before}` +
         `<span style="display:inline-block;width:${lineW}pt;height:${namePt}pt;` +
         `border-bottom:0.75pt solid #333;margin-left:4pt;">&nbsp;</span></p>`;
}

function exportWord() {
  if (!currentLayout || (!currentLayout.rows.length && !currentLayout.poems.length)) {
    alert('请先生成预览'); return;
  }

  const { title, nameLine, cellSize, wordGap, pySize, rows, paperKey, poems, fontCn } = currentLayout;
  const p = PAPERS[paperKey];

  const cellPt   = px2pt(cellSize);
  const gapPt    = px2pt(wordGap);
  const pyPt     = px2pt(pySize);
  const rowGapPt = px2pt(16);
  const titlePt  = px2pt(22);
  const namePt   = px2pt(14);

  let content = '';

  if (title) {
    content += `<p style="text-align:center;font-size:${titlePt}pt;font-weight:bold;` +
               `font-family:${fontCn};margin:0 0 ${px2pt(12)}pt 0;">${esc(title)}</p>`;
  }
  if (nameLine) {
    content += nameLineHTML(nameLine, namePt, fontCn);
  }

  rows.forEach(rowWords => {
    content += lineTableHTML(rowWords, cellPt, gapPt, pyPt);
    content += `<p style="margin:0;font-size:${rowGapPt}pt;line-height:${rowGapPt}pt;">&nbsp;</p>`;
  });

  poems.forEach(poem => {
    content += `<p style="text-align:center;font-size:${px2pt(18)}pt;font-weight:bold;` +
               `font-family:${fontCn};margin:${px2pt(30)}pt 0 ${px2pt(6)}pt 0;">${esc(poem.title)}</p>`;
    if (poem.author) {
      content += `<p style="text-align:center;font-size:${px2pt(14)}pt;color:#555;` +
                 `font-family:${fontCn};margin:0 0 ${px2pt(36)}pt 0;">${esc(poem.author)}</p>`;
    } else {
      content += `<p style="width:${px2pt(220)}pt;margin:${px2pt(28)}pt auto ${px2pt(36)}pt auto;` +
                 `border-bottom:0.75pt solid #333;font-size:1pt;">&nbsp;</p>`;
    }
    for (let i = 0; i < poem.lines; i++) {
      content += `<p style="width:${px2pt(poem.chars * cellSize)}pt;margin:0 auto ${px2pt(40)}pt auto;` +
                 `border-bottom:0.75pt solid #333;font-size:1pt;">&nbsp;</p>`;
    }
  });

  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office"
          xmlns:w="urn:schemas-microsoft-com:office:word"
          xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${esc(title || '看拼音写词语')}</title>
    <style>
      @page Section1 { size:${px2pt(p.w)}pt ${px2pt(p.h)}pt; margin:42.5pt 42.5pt 42.5pt 42.5pt; }
      div.Section1 { page:Section1; }
      body { font-family:${fontCn}; }
    </style>
    </head>
    <body><div class="Section1">${content}</div></body></html>`;

  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = (title || '看拼音写词语') + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

============================================================ */

/* 打印 / 保存为 PDF */
function printPDF() {
  const title = document.getElementById('title').value || '看拼音写词语练习';
  const originalTitle = document.title;
  document.title = title;
  window.print();
  document.title = originalTitle;
}

/* 控件变化时自动重新生成 */
['paperSize', 'packMode', 'fontChinese'].forEach(id =>
  document.getElementById(id).addEventListener('change', generate)
);

/* ---------- 修改后自动重新生成（300ms 防抖） ---------- */
let genTimer = null;
function autoGenerate() {
  clearTimeout(genTimer);
  genTimer = setTimeout(generate, 300);  // 停止输入 300ms 后才刷新
}

['title', 'nameLine', 'cellSize', 'wordGap', 'words', 'poems'].forEach(id =>
  document.getElementById(id).addEventListener('input', autoGenerate)
);

/* 页面加载：先填入 CONFIG 默认值，再生成预览 */
window.addEventListener('load', () => {
  applyConfigToControls();
  generate();
});
</script>
